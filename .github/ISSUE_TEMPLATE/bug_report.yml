name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Is it a security vulnerability?** Then stop here and report it privately: see [SECURITY.md](https://github.com/DuttonAlan/Logbook/blob/main/SECURITY.md).

        Never paste API Keys, passwords or connection strings into an issue, and remove personal data from log samples.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, requests or configuration that shows the problem.
      placeholder: |
        1. Configure the SDK with …
        2. Log …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Logbook version
      description: Release, image tag, SDK package version or commit.
      placeholder: e.g. 0.1.0, ghcr.io/duttonalan/logbook:0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server (API)
        - Web interface
        - SDK (Logbook.Sdk, Logbook.Extensions.Logging, Logbook.AspNetCore)
        - Container images / Docker Compose
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run Logbook?
      options:
        - Docker Compose from this repository
        - Container image
        - From source (dotnet run)
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PostgreSQL version, reverse proxy, OS, browser, .NET version of the application using the SDK, if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, with their Event Ids. Remove anything sensitive.
      render: text
