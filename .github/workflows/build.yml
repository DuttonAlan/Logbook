name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Logbook.slnx

      - name: Build
        run: dotnet build Logbook.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution Logbook.slnx --configuration Release --no-build

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Check for missing migrations
        env:
          ConnectionStrings__Database: Host=localhost;Database=ci;Username=ci;Password=ci
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Logbook.Infrastructure
          --startup-project src/Logbook.Api
          --configuration Release

      - name: Pack SDK
        run: |
          for project in sdk/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output artifacts/packages
          done

  web:
    name: Web interface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Logbook.Web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Logbook.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  container-images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the server image
        run: docker build --target runtime --tag logbook:ci .

      - name: Build the migrator image
        run: docker build --target migrator --tag logbook-migrator:ci .

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the stack, then send and find a Log Event
        run: .github/scripts/compose-smoke-test.sh
