# Runs Logbook with PostgreSQL on http://localhost:5080 for local evaluation.
# Step by step: docs/tutorials/getting-started.md.
#
# Before the first start:
#   cp .env.example .env              # then set the two passwords in .env
#   docker compose up --build

name: logbook

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: logbook
      POSTGRES_USER: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # Since PostgreSQL 18, the image keeps its data in a versioned folder below this path.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies the database migrations, then exits. Logbook never migrates at startup.
  migrate:
    build:
      context: .
      target: migrator
    image: logbook-migrator:local
    environment:
      ConnectionStrings__Database: Host=db;Database=logbook;Username=logbook;Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  logbook:
    build:
      context: .
      target: runtime
    image: logbook:local
    # Longer than the shutdown timeout of the host (30 s), so Log Events in the queue get written on "docker compose stop".
    stop_grace_period: 35s
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "5080:8080"
    environment:
      AllowedHosts: localhost
      ConnectionStrings__Database: Host=db;Database=logbook;Username=logbook;Password=${POSTGRES_PASSWORD}
      SignIn__Administrator__Password: ${LOGBOOK_ADMIN_PASSWORD:?Set LOGBOOK_ADMIN_PASSWORD in .env}

volumes:
  db-data:
